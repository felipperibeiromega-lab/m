    <div id="imageModal" class="modal">
        <span id="prevModal" class="modal-nav prev">&lt;</span>
        <span id="nextModal" class="modal-nav next">&gt;</span>
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
      const mobileMenuButton = document.getElementById('mobile-menu-button');
      const mobileMenu = document.getElementById('mobile-menu');

      if(mobileMenuButton) {
        mobileMenuButton.addEventListener('click', function() {
            mobileMenu.classList.toggle('hidden');
        });
      }

      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      const closeBtn = document.querySelector('.modal-close');

      // Lista de imagens que abrem o modal
      const clickableImages = ['imgResultado', 'imgDepoimento'];

      clickableImages.forEach(id => {
        const img = document.getElementById(id);
        if (img) {
          img.onclick = function() {
            modal.style.display = "flex";
            modal.classList.add('open');
            modalImg.src = this.src;
          }
        }
      });

      // Fechar o modal
      const closeModal = function() {
        modal.classList.remove('open');
        setTimeout(() => {
          modal.style.display = "none";
        }, 300); // Espera a transição do CSS
      }

      if(closeBtn) {
        closeBtn.onclick = closeModal;
      }
      if(modal) {
        modal.onclick = function(event) {
            // Fecha se clicar fora da imagem
            if (event.target === modal) {
            closeModal();
            }
        }
      }

      const prevModal = document.getElementById('prevModal');
      if (prevModal) {
        // Remove a navegação prev/next, pois não é um carrossel
        prevModal.style.display = 'none';
      }
      const nextModal = document.getElementById('nextModal');
      if(nextModal) {
        nextModal.style.display = 'none';
      }
    });
    </script>
